<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Все термины</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --danger: #ef4444;
      --warning: #ffc107;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --gradient: linear-gradient(135deg, #6366f1, #a78bfa);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --border: #334155;
      --shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.5s ease, color 0.5s ease;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s;
      background: rgba(99,102,241,0.1);
    }
    nav a:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-3px);
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.3s;
    }
    .theme-toggle:hover { color: var(--primary); transform: rotate(20deg) scale(1.2); }
    section {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      margin: 2rem 0;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: var(--gradient);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(99,102,241,0.3);
      margin-bottom: 1.5rem;
    }
    .refresh-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(99,102,241,0.5);
    }
    .refresh-btn i {
      transition: transform 0.4s ease;
    }
    .refresh-btn:hover i {
      transform: rotate(180deg);
    }
    .term-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      transition: all 0.4s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .term-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .term-title {
      margin: 0 0 1rem;
      color: var(--primary);
      font-size: 1.6rem;
      font-weight: 800;
    }
    .term-def { margin: 0 0 1.2rem; color: var(--text-light); line-height: 1.8; font-size: 1.1rem; }
    .photos { display: flex; flex-wrap: wrap; gap: 12px; margin: 1rem 0; }
    .photos img {
      max-width: 220px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }
    .photos img:hover { transform: scale(1.05); }
    .actions { margin-top: 1.2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .edit-btn {
      background: var(--warning);
      color: black;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .edit-btn:hover { background: #e0a800; }
    .delete-btn {
      background: var(--danger);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .delete-btn:hover { background: #c82333; }
    #editModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card);
      padding: 2.5rem;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: modalFade 0.4s ease;
    }
    @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .close-btn {
      float: right;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text-light);
    }
    .close-btn:hover { color: var(--text); }
    #editPreview-container { display: flex; flex-wrap: wrap; gap: 12px; margin: 1rem 0; }
    .edit-preview-img { max-width: 180px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    #error { color: var(--danger); margin: 1rem 0; padding: 1rem; background: rgba(239,68,68,0.15); border-radius: 8px; text-align: center; }
    #status {
      text-align: center;
      color: var(--text-light);
      padding: 1.5rem 0;
      font-size: 1.2rem;
      font-style: italic;
      min-height: 50px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Все термины</h1>
      <button class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-sun"></i>
      </button>
    </header>

    <nav>
      <a href="./index.html">Поиск</a>
      <a href="./add.html">Добавить термин</a>
    </nav>

    <section>
      <button class="refresh-btn" onclick="showAll()">
        <i class="fas fa-sync-alt"></i> Обновить
      </button>
      <div id="status">Нажмите «Обновить», чтобы загрузить термины</div>
      <div id="allTerms"></div>
    </section>

    <!-- Модальное окно редактирования -->
    <div id="editModal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeEditModal()">×</span>
        <h2>Изменить термин</h2>
        <input id="editTerm" readonly style="background:#eee; width:100%; padding:12px; margin:12px 0; border-radius:8px;" />
        <textarea id="editDefinition" rows="7" placeholder="Определение..."></textarea>
        
        <label style="display:block; margin:1.2rem 0 0.6rem; font-weight:600;">Добавить фото:</label>
        <input type="file" id="editPhoto" accept="image/*" />
        <div id="editPreview-container"></div>

        <button onclick="saveEdit()">Сохранить изменения</button>
      </div>
    </div>

    <div id="error"></div>
  </div>

  <script>
    const PASSWORD = "bm2315";

    let currentEditTerm = null;

    function showAll() {
      const status = document.getElementById("status");
      const errorDiv = document.getElementById("error");
      const container = document.getElementById("allTerms");

      if (!status) {
        console.error("Элемент #status не найден!");
        return;
      }

      status.textContent = "Загрузка терминов...";
      errorDiv.textContent = "";
      container.innerHTML = "";

      const terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      if (terms.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-light);font-size:1.2rem;'>Пока нет терминов. Добавьте на странице «Добавить термин».</p>";
        status.textContent = "Глоссарий пуст";
        return;
      }

      terms.sort((a, b) => a.term.localeCompare(b.term, 'ru'));

      terms.forEach(item => {
        const div = document.createElement("div");
        div.className = "term-item";
        let html = `
          <h3 class="term-title">${item.term}</h3>
          <p class="term-def">${item.definition.replace(/\n/g, "<br>")}</p>
        `;
        if (item.photos && item.photos.length > 0) {
          html += '<div class="photos">';
          item.photos.forEach(p => html += `<img src="${p}" alt="${item.term}">`);
          html += '</div>';
        }
        html += `
          <button class="edit-btn" onclick="requestPasswordToEdit('${item.term.replace(/'/g, "\\'")}')">Изменить</button>
          <button class="delete-btn" onclick="requestPasswordToDelete('${item.term.replace(/'/g, "\\'")}')">Удалить</button>
        `;
        div.innerHTML = html;
        container.appendChild(div);
      });

      status.textContent = `Найдено терминов: ${terms.length}`;
    }

    function requestPasswordToEdit(term) {
      const password = prompt("Введите пароль для изменения:");
      if (password === PASSWORD) {
        openEditModal(term);
      } else if (password !== null) {
        alert("Неверный пароль!");
      }
    }

    function openEditModal(term) {
      const terms = JSON.parse(localStorage.getItem("glossary") || "[]");
      const found = terms.find(t => t.term === term);
      if (!found) return alert("Термин не найден");

      currentEditTerm = term;

      document.getElementById("editTerm").value = term;
      document.getElementById("editDefinition").value = found.definition;
      const previewContainer = document.getElementById("editPreview-container");
      previewContainer.innerHTML = "";

      if (found.photos && found.photos.length > 0) {
        found.photos.forEach(p => {
          const img = document.createElement("img");
          img.src = p;
          img.className = "edit-preview-img";
          previewContainer.appendChild(img);
        });
      }

      document.getElementById("editModal").style.display = "flex";
    }

    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
      currentEditTerm = null;
      document.getElementById("editPreview-container").innerHTML = "";
      document.getElementById("editPhoto").value = "";
    }

    async function saveEdit() {
      const term = currentEditTerm;
      const newDef = document.getElementById("editDefinition").value.trim();
      const newPhotoFile = document.getElementById("editPhoto").files[0];

      if (!newDef) {
        alert("Заполните определение!");
        return;
      }

      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      let newPhoto = null;
      if (newPhotoFile) {
        newPhoto = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              const canvas = document.createElement("canvas");
              canvas.width = img.width / 3.5 * 0.85;
              canvas.height = img.height / 3.5 * 0.85;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", 0.60));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(newPhotoFile);
        });
      }

      terms = terms.map(t => {
        if (t.term === term) {
          t.definition = newDef;
          if (newPhoto) {
            t.photos = t.photos || [];
            t.photos.push(newPhoto);
          }
        }
        return t;
      });

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert("Изменения сохранены!");
      closeEditModal();
      showAll();
    }

    function requestPasswordToDelete(term) {
      const password = prompt("Введите пароль для удаления:");
      if (password === PASSWORD) {
        deleteTerm(term);
      } else if (password !== null) {
        alert("Неверный пароль!");
      }
    }

    function deleteTerm(term) {
      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");
      terms = terms.filter(t => t.term !== term);
      localStorage.setItem("glossary", JSON.stringify(terms));
      showAll();
      alert("Термин удалён");
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.querySelector('.theme-toggle i');
      
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fas fa-moon';
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        icon.className = 'fas fa-sun';
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-toggle i').className = savedTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';

    window.onload = showAll;
  </script>
</body>
</html>
