<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
    h1 { text-align: center; color: #333; }
    section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: white; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; border: 1px solid #aaa; border-radius: 6px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #218838; }
    #preview { max-width: 300px; margin: 10px 0; display: block; border-radius: 8px; }
    #error { color: red; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>Добавить термин</h1>

  <nav style="text-align:center; margin:20px 0;">
    <a href="index.html">Поиск</a> | 
    <a href="all.html">Все термины</a>
  </nav>

  <section>
    <input id="term" placeholder="Термин (обязательно)" />
    <textarea id="definition" rows="5" placeholder="Определение..."></textarea>
    <label>Фото (необязательно):</label>
    <input type="file" id="photo" accept="image/*" />
    <img id="preview" alt="Предпросмотр" style="display:none;" />
    <button onclick="saveTerm()">Сохранить</button>
  </section>

  <div id="error"></div>

  <script>
    // Предпросмотр фото
    document.getElementById("photo").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("preview").src = e.target.result;
          document.getElementById("preview").style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    function saveTerm() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoInput = document.getElementById("photo");
      const error = document.getElementById("error");

      if (!term || !def) {
        error.textContent = "Заполните термин и определение!";
        return;
      }

      let photo = null;
      if (photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photo = e.target.result;
          saveToStorage(term, def, photo);
        };
        reader.readAsDataURL(photoInput.files[0]);
      } else {
        saveToStorage(term, def, null);
      }
    }

    function saveToStorage(term, def, photo) {
      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      const existing = terms.find(t => t.term === term);
      if (existing) {
        existing.definition = def;
        existing.photo = photo;
      } else {
        terms.push({ term, definition: def, photo });
      }

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert("Термин сохранён!");
      document.getElementById("term").value = "";
      document.getElementById("definition").value = "";
      document.getElementById("photo").value = "";
      document.getElementById("preview").style.display = "none";
      document.getElementById("error").textContent = "";
    }
  </script>
</body>
</html>
