<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
    h1 { text-align: center; }
    section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: white; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .preview-img { max-width: 150px; border-radius: 8px; }
    #error { color: red; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>Добавить термин</h1>

  <nav style="text-align:center; margin:20px 0;">
    <a href="index.html">Поиск</a> | 
    <a href="all.html">Все термины</a>
  </nav>

  <section>
    <input id="term" placeholder="Термин (обязательно)" />
    <textarea id="definition" rows="5" placeholder="Определение..."></textarea>
    
    <label>Фото (можно несколько):</label>
    <input type="file" id="photos" accept="image/*" multiple />
    <div id="preview-container"></div>

    <button onclick="saveTerm()">Сохранить</button>
  </section>

  <div id="error"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAGrlpsF9eTQvb7B2Ec29TnaD3Zl-VBjbs",
      authDomain: "my-glossary-55f58.firebaseapp.com",
      projectId: "my-glossary-55f58",
      storageBucket: "my-glossary-55f58.firebasestorage.app",
      messagingSenderId: "875015503393",
      appId: "1:875015503393:web:e8b19a0213be249275ad60"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const glossary = db.collection("glossary");

    const PASSWORD = "bm2315";

    // Предпросмотр нескольких фото
    document.getElementById("photos").addEventListener("change", function(e) {
      const container = document.getElementById("preview-container");
      container.innerHTML = "";

      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.className = "preview-img";
          container.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    async function saveTerm() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoFiles = document.getElementById("photos").files;
      const error = document.getElementById("error");

      if (!term || !def) {
        error.textContent = "Заполните оба поля!";
        return;
      }

      const photos = [];

      for (const file of photoFiles) {
        const base64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
        photos.push(base64);
      }

      try {
        await glossary.doc(term).set({
          definition: def,
          photos: photos,
          updated: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Термин сохранён!");
        document.getElementById("term").value = "";
        document.getElementById("definition").value = "";
        document.getElementById("photos").value = "";
        document.getElementById("preview-container").innerHTML = "";
        error.textContent = "";
      } catch (e) {
        error.textContent = "Ошибка: " + e.message;
      }
    }

    function checkPassword() {
      const pass = document.getElementById("password").value;
      if (pass === PASSWORD) {
        document.getElementById("passwordForm").style.display = "none";
        document.getElementById("addForm").style.display = "block";
      } else {
        alert("Неверный пароль!");
      }
    }
  </script>
</body>
</html>
