<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #6366f1; }
    nav { text-align: center; margin: 20px 0; }
    nav a { margin: 0 15px; color: #6366f1; text-decoration: none; font-weight: bold; }
    section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #4f46e5; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    #preview-container img { max-width: 150px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    #error { color: #ef4444; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <h1>Добавить термин</h1>

  <nav>
    <a href="./index.html">Поиск</a>
    <a href="./all.html">Все термины</a>
  </nav>

  <section id="passwordForm">
    <input type="password" id="password" placeholder="Пароль..." />
    <button onclick="checkPassword()">Войти</button>
    <div id="error"></div>
  </section>

  <section id="addForm" style="display:none;">
    <input id="term" placeholder="Термин (обязательно)" />
    <textarea id="definition" rows="5" placeholder="Определение..."></textarea>
    
    <label>Добавить фото (можно несколько):</label>
    <input type="file" id="photo" accept="image/*" />
    <div id="preview-container"></div>

    <button onclick="addOrUpdate()">Сохранить</button>
  </section>

  <script>
    const PASSWORD = "bm2315";

    function checkPassword() {
      const pass = document.getElementById("password").value;
      if (pass === PASSWORD) {
        document.getElementById("passwordForm").style.display = "none";
        document.getElementById("addForm").style.display = "block";
      } else {
        document.getElementById("error").textContent = "Неверный пароль!";
      }
    }

    document.getElementById("photo").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          document.getElementById("preview-container").appendChild(img);
        };
        reader.readAsDataURL(file);
      }
    });

    function addOrUpdate() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoFile = document.getElementById("photo").files[0];

      if (!term || !def) {
        alert("Заполните оба поля!");
        return;
      }

      let photoUrl = null;
      if (photoFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoUrl = e.target.result;
          saveTerm(term, def, photoUrl);
        };
        reader.readAsDataURL(photoFile);
      } else {
        saveTerm(term, def, null);
      }
    }

    function saveTerm(term, def, photoUrl) {
      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      let existing = terms.find(t => t.term === term);

      if (existing) {
        existing.definition = def;
        if (photoUrl) {
          existing.photos = existing.photos || [];
          existing.photos.push(photoUrl);
        }
      } else {
        const newTerm = { term, definition: def, photos: [] };
        if (photoUrl) newTerm.photos.push(photoUrl);
        terms.push(newTerm);
      }

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert("Сохранено! Добавлено " + (photoUrl ? "фото" : "без фото"));
      document.getElementById("term").value = "";
      document.getElementById("definition").value = "";
      document.getElementById("photo").value = "";
      document.getElementById("preview-container").innerHTML = "";
    }

    function toggleTheme() {
      document.documentElement.toggleAttribute('data-theme');
    }
  </script>
</body>
</html>
