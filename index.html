<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Поиск</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --border: #334155;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --danger: #ef4444;
      --warning: #ffc107;
      --shadow: 0 10px 30px rgba(0,0,0,0.4);
      --gradient: linear-gradient(135deg, #6366f1, #a78bfa);
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.5s ease, color 0.5s ease;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    nav {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s;
      background: rgba(99,102,241,0.1);
    }
    nav a:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-3px);
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.3s;
    }
    .theme-toggle:hover { color: var(--primary); transform: rotate(20deg) scale(1.2); }
    section {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      margin: 2rem 0;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all 0.4s ease;
    }
    section:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    input {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      background: var(--bg);
      color: var(--text);
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.2);
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: all 0.3s;
    }
    button:hover { background: var(--primary-dark); transform: translateY(-2px); }
    #result {
      margin-top: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      display: none;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .term-title { margin: 0 0 1rem; color: var(--primary); font-size: 1.8rem; font-weight: 800; }
    .term-def { margin: 0; color: var(--text-light); line-height: 1.8; font-size: 1.1rem; }
    .photos img { max-width: 100%; border-radius: 12px; margin: 1rem 0; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    #error { color: var(--danger); margin-top: 1rem; padding: 1rem; background: rgba(239,68,68,0.15); border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Глоссарий</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <nav>
      <a href="all.html">Все термины</a>
      <a href="add.html">Добавить термин</a>
    </nav>

    <section>
      <input id="searchTerm" placeholder="Введите термин..." />
      <button onclick="search()">Найти</button>
      <div id="result"></div>
    </section>

    <div id="error"></div>
  </div>

  <script>
    function search() {
      const term = document.getElementById("searchTerm").value.trim();
      if (!term) return alert("Введите термин");

      const terms = JSON.parse(localStorage.getItem("glossary") || "[]");
      const found = terms.find(t => t.term.toLowerCase() === term.toLowerCase());

      const result = document.getElementById("result");
      const error = document.getElementById("error");
      error.textContent = "";

      if (found) {
        let html = `<h3 class="term-title">${found.term}</h3>
                    <p class="term-def">${found.definition.replace(/\n/g, "<br>")}</p>`;
        if (found.photos && found.photos.length > 0) {
          html += '<div class="photos">';
          found.photos.forEach(p => html += `<img src="${p}" alt="${found.term}">`);
          html += '</div>';
        }
        result.innerHTML = html;
        result.style.display = "block";
      } else {
        error.textContent = "Термин не найден 😔";
        result.style.display = "none";
      }
    }

    function toggleTheme() {
      const body = document.body;
      const icon = document.querySelector('.theme-toggle i');
      if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        icon.className = 'fas fa-moon';
      } else {
        body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fas fa-sun';
      }
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      document.querySelector('.theme-toggle i').className = 'fas fa-sun';
    }
  </script>
</body>
</html>
