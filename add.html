<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.8rem; font-weight: 700; margin: 0; }
    nav {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin: 1.5rem 0 2rem;
      flex-wrap: wrap;
    }
    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--primary); }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-light);
      transition: color 0.2s, transform 0.2s;
    }
    .theme-toggle:hover { color: var(--primary); transform: scale(1.15); }
    section {
      background: var(--card);
      border-radius: 12px;
      padding: 2rem;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .password-section {
      max-width: 500px;
      margin: 4rem auto;
      text-align: center;
    }
    input, textarea {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      margin: 0.8rem 0;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    button {
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    #preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 1rem 0;
    }
    .preview-img {
      max-width: 200px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #error { color: var(--danger); margin: 1rem 0; padding: 1rem; background: rgba(239,68,68,0.1); border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Добавить термин</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <nav>
      <a href="./index.html">Поиск</a>
      <a href="./all.html">Все термины</a>
    </nav>

    <section class="password-section" id="passwordForm">
      <h3>Введите пароль</h3>
      <input type="password" id="password" placeholder="Пароль..." />
      <button onclick="checkPassword()">Войти</button>
      <div id="error"></div>
    </section>

    <section id="addForm" style="display:none;">
      <input id="term" placeholder="Термин (обязательно)" />
      <textarea id="definition" rows="6" placeholder="Определение..."></textarea>
      
      <label style="display:block; margin:1rem 0 0.5rem; font-weight:500;">Фото (можно несколько)</label>
      <input type="file" id="photos" accept="image/*" multiple />
      <div id="preview-container"></div>

      <button onclick="addOrUpdate()">Сохранить</button>
    </section>
  </div>

  <script>
    const PASSWORD = "bm2315"; // ← измени на свой

    function checkPassword() {
      const pass = document.getElementById("password").value;
      const passwordForm = document.getElementById("passwordForm");
      const addForm = document.getElementById("addForm");
      const error = document.getElementById("error");

      if (pass === PASSWORD) {
        passwordForm.style.display = "none";
        addForm.style.display = "block";
        error.textContent = "";
      } else {
        error.textContent = "Неверный пароль!";
      }
    }

    // Предпросмотр нескольких фото
    document.getElementById("photos").addEventListener("change", function(e) {
      const container = document.getElementById("preview-container");
      container.innerHTML = "";

      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.className = "preview-img";
          container.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    async function addOrUpdate() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoFiles = document.getElementById("photos").files;
      const error = document.getElementById("error");

      if (!term || !def) {
        error.textContent = "Заполните оба поля!";
        return;
      }

      const photos = [];

      for (const file of photoFiles) {
        const img = await new Promise(resolve => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.src = URL.createObjectURL(file);
        });

        const canvas = document.createElement("canvas");
        canvas.width = img.width / 3.5;
        canvas.height = img.height / 3.5;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const compressed = canvas.toDataURL("image/jpeg", 0.65);
        photos.push(compressed);
      }

      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      const existing = terms.find(t => t.term === term);
      if (existing) {
        existing.definition = def;
        existing.photos = photos;
      } else {
        terms.push({ term, definition: def, photos });
      }

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert(`Термин сохранён! Фото: ${photos.length} шт (сжаты в 3.5 раза)`);
      document.getElementById("term").value = "";
      document.getElementById("definition").value = "";
      document.getElementById("photos").value = "";
      document.getElementById("preview-container").innerHTML = "";
      error.textContent = "";
    }

    function toggleTheme() {
      const body = document.body;
      const icon = document.querySelector('.theme-toggle i');
      if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        icon.className = 'fas fa-moon';
      } else {
        body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fas fa-sun';
      }
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      document.querySelector('.theme-toggle i').className = 'fas fa-sun';
    }
  </script>
</body>
</html>
