<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
    h1 { text-align: center; color: #333; }
    section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: white; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; border: 1px solid #aaa; border-radius: 6px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #218838; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .preview-img { max-width: 150px; border-radius: 8px; border: 1px solid #ddd; }
    #error { color: red; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>Добавить / изменить термин</h1>

  <nav style="text-align:center; margin:20px 0;">
    <a href="index.html">Поиск</a> | 
    <a href="all.html">Все термины</a>
  </nav>

  <section>
    <input id="term" placeholder="Термин (обязательно)" />
    <textarea id="definition" rows="5" placeholder="Определение..."></textarea>
    
    <label>Фото (можно несколько):</label>
    <input type="file" id="photos" accept="image/*" multiple />
    <div id="preview-container"></div>

    <button onclick="saveTerm()">Сохранить</button>
  </section>

  <div id="error"></div>

  <script>
    // Предпросмотр нескольких фото
    document.getElementById("photos").addEventListener("change", function(e) {
      const container = document.getElementById("preview-container");
      container.innerHTML = ""; // очищаем предыдущие предпросмотры

      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.className = "preview-img";
          container.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    async function saveTerm() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoFiles = document.getElementById("photos").files;
      const error = document.getElementById("error");

      if (!term || !def) {
        error.textContent = "Заполните оба поля!";
        return;
      }

      const photos = [];

      // Сжимаем каждое фото в 3.5 раза
      for (const file of photoFiles) {
        const img = await new Promise(resolve => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.src = URL.createObjectURL(file);
        });

        const canvas = document.createElement("canvas");
        canvas.width = img.width / 3.5;
        canvas.height = img.height / 3.5;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const compressed = canvas.toDataURL("image/jpeg", 0.65); // 65% качества
        photos.push(compressed);
      }

      // Сохраняем в localStorage
      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      const existing = terms.find(t => t.term === term);
      if (existing) {
        existing.definition = def;
        existing.photos = photos; // массив фото
      } else {
        terms.push({ term, definition: def, photos });
      }

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert(`Термин сохранён! Фото: ${photos.length} шт (сжаты в 3.5 раза)`);
      document.getElementById("term").value = "";
      document.getElementById("definition").value = "";
      document.getElementById("photos").value = "";
      document.getElementById("preview-container").innerHTML = "";
      error.textContent = "";
    }
  </script>
</body>
</html>
