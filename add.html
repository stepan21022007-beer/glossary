<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глоссарий — Добавить термин</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      transition: background 0.4s, color 0.4s;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.8rem; }
    nav { text-align: center; margin: 20px 0; }
    nav a { margin: 0 15px; color: var(--text-light); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--primary); }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-light);
    }
    section {
      background: var(--card);
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
    }
    button {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }
    button:hover { background: var(--primary-dark); }
    #preview { max-width: 300px; margin: 15px 0; display: block; border-radius: 8px; }
    #error { color: #ef4444; margin: 15px 0; padding: 10px; background: rgba(239,68,68,0.1); border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Добавить термин</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <nav>
      <a href="index.html">Поиск</a>
      <a href="all.html">Все термины</a>
    </nav>

    <section id="passwordForm">
      <h3>Введите пароль</h3>
      <input type="password" id="password" placeholder="Пароль..." />
      <button onclick="checkPassword()">Войти</button>
      <div id="error"></div>
    </section>

    <section id="addForm" style="display:none;">
      <input id="term" placeholder="Термин (обязательно)" />
      <textarea id="definition" rows="5" placeholder="Определение..."></textarea>
      <label>Фото (необязательно):</label>
      <input type="file" id="photo" accept="image/*" />
      <img id="preview" alt="Предпросмотр" style="display:none;" />
      <button onclick="saveTerm()">Сохранить</button>
    </section>
  </div>

  <script>
    const PASSWORD = "bm2315"; // ← измени на свой пароль

    function checkPassword() {
      const pass = document.getElementById("password").value;
      const error = document.getElementById("error");
      if (pass === PASSWORD) {
        document.getElementById("passwordForm").style.display = "none";
        document.getElementById("addForm").style.display = "block";
        error.textContent = "";
      } else {
        error.textContent = "Неверный пароль";
      }
    }

    // Предпросмотр фото
    document.getElementById("photo").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("preview").src = e.target.result;
          document.getElementById("preview").style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    function saveTerm() {
      const term = document.getElementById("term").value.trim();
      const def = document.getElementById("definition").value.trim();
      const photoInput = document.getElementById("photo");
      const error = document.getElementById("error");

      if (!term || !def) {
        error.textContent = "Заполните оба поля!";
        return;
      }

      let photo = null;
      if (photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photo = e.target.result;
          saveToLocal(term, def, photo);
        };
        reader.readAsDataURL(photoInput.files[0]);
      } else {
        saveToLocal(term, def, null);
      }
    }

    function saveToLocal(term, def, photo) {
      let terms = JSON.parse(localStorage.getItem("glossary") || "[]");

      const existing = terms.find(t => t.term === term);
      if (existing) {
        existing.definition = def;
        existing.photo = photo;
      } else {
        terms.push({ term, definition: def, photo });
      }

      localStorage.setItem("glossary", JSON.stringify(terms));
      alert("Термин сохранён локально!");
      document.getElementById("term").value = "";
      document.getElementById("definition").value = "";
      document.getElementById("photo").value = "";
      document.getElementById("preview").style.display = "none";
      document.getElementById("error").textContent = "";
    }

    function toggleTheme() {
      const body = document.body;
      const icon = document.querySelector('.theme-toggle i');
      if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        icon.className = 'fas fa-moon';
      } else {
        body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fas fa-sun';
      }
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      document.querySelector('.theme-toggle i').className = 'fas fa-sun';
    }
  </script>
</body>
</html>
